
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d4ca3">
  <title>ClipNest Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f2fa;
      color: #292536;
      text-align: center;
      padding: 60px 20px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
    }
    h1 {
      color: #6d4ca3;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ClipNest</h1>
    <h2>You're offline</h2>
    <p>Your internet connection isn't available right now.</p>
    <p>Reconnect and try again. Your saved clips on this device remain available when the app loads successfully.</p>
  </div>
</body>
</html>
