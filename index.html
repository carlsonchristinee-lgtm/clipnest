
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7046a3">
<title>ClipNest</title>
<style>
:root {
  --purple:#7046a3;
  --light:#f5f0fb;
  --dark:#292235;
  --white:#fff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--dark);
}
header {
  background:var(--purple);
  color:white;
  padding:22px;
  text-align:center;
}
header h1 { margin:0; font-size:28px; }
header p { margin:7px 0 0; }
main {
  max-width:850px;
  margin:auto;
  padding:18px;
}
.panel {
  background:white;
  padding:17px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 2px 9px #0000000c;
}
input,textarea,select,button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}
textarea { min-height:110px; resize:vertical; }
button {
  background:var(--purple);
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
button.secondary { background:#e9e0f3;color:#493264; }
button.delete { background:#a83c4b; }
button.small { width:auto; padding:9px 13px; }
.tabs {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.tabs button { flex:1; min-width:90px; }
.clip {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  border-left:4px solid var(--purple);
}
.clip h3 { margin:0 0 7px; }
.clip p { white-space:pre-wrap; overflow-wrap:anywhere; }
.meta { color:#777; font-size:12px; }
.actions { display:flex;gap:7px;flex-wrap:wrap; }
.actions button { flex:1; min-width:75px; }
#empty { text-align:center;color:#777;padding:25px; }
footer { text-align:center;padding:20px;color:#777;font-size:12px; }
</style>
</head>
<body>

<header>
  <h1>🌸 ClipNest</h1>
  <p>Your personal copy, paste and storage library</p>
</header>

<main>

<section class="panel">
  <h2>📥 Save a New Clip</h2>
  <input id="clipTitle" placeholder="Give your clip a name">
  <select id="clipCategory">
    <option value="Text">Text</option>
    <option value="Image">Image</option>
    <option value="Link">Link</option>
    <option value="Prompt">AI Prompt</option>
    <option value="Caption">Caption</option>
    <option value="Other">Other</option>
  </select>
  <input id="clipFolder" placeholder="Folder name (example: Bloom Bugs)">
  <textarea id="clipContent" placeholder="Paste or type your saved content here..."></textarea>
  <button onclick="saveClip()">＋ Save to ClipNest</button>
  <button class="secondary" onclick="pasteFromClipboard()">📋 Paste from Clipboard</button>
</section>

<section class="panel">
  <h2>🔎 Find Your Clips</h2>
  <input id="search" placeholder="Search titles, folders or content..." oninput="renderClips()">
  <select id="filterCategory" onchange="renderClips()">
    <option value="All">All Categories</option>
    <option value="Text">Text</option>
    <option value="Image">Image</option>
    <option value="Link">Link</option>
    <option value="Prompt">AI Prompt</option>
    <option value="Caption">Caption</option>
    <option value="Other">Other</option>
  </select>
  <div class="tabs">
    <button class="secondary" onclick="showAll()">All Clips</button>
    <button class="secondary" onclick="showFolders()">Folders</button>
  </div>
</section>

<section class="panel">
  <h2 id="listTitle">📚 My Library</h2>
  <div id="clipList"></div>
</section>

<section class="panel">
  <h2>📊 Your ClipNest</h2>
  <p id="statistics">0 saved clips</p>
  <button class="secondary" onclick="exportData()">⬇️ Backup My Library</button>
  <button class="secondary" onclick="document.getElementById('importFile').click()">⬆️ Restore Backup</button>
  <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
</section>

</main>

<footer>
  ClipNest • Your ideas belong in one place 🌷
  <br>Version 1.0
</footer>

<script>
let clips = JSON.parse(localStorage.getItem("clipnest_data") || "[]");
let folderMode = false;

function saveData() {
  localStorage.setItem("clipnest_data", JSON.stringify(clips));
}

function saveClip() {
  const title = document.getElementById("clipTitle").value.trim();
  const content = document.getElementById("clipContent").value.trim();

  if (!content) {
    alert("Please enter something to save.");
    return;
  }

  clips.unshift({
    id: Date.now().toString(),
    title: title || "Untitled Clip",
    content: content,
    category: document.getElementById("clipCategory").value,
    folder: document.getElementById("clipFolder").value.trim() || "Unsorted",
    date: new Date().toISOString()
  });

  saveData();

  document.getElementById("clipTitle").value = "";
  document.getElementById("clipContent").value = "";
  document.getElementById("clipFolder").value = "";

  renderClips();
  alert("Your clip has been saved!");
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("clipContent").value = text;
  } catch (error) {
    alert("Clipboard access was blocked. Tap the content box and use Paste from your phone keyboard.");
  }
}

async function copyClip(id) {
  const clip = clips.find(c => c.id === id);
  if (!clip) return;

  try {
    await navigator.clipboard.writeText(clip.content);
    alert("Copied! Ready to paste.");
  } catch (error) {
    alert("Select and copy the content manually.");
  }
}

function deleteClip(id) {
  if (!confirm("Delete this clip permanently?")) return;
  clips = clips.filter(c => c.id !== id);
  saveData();
  renderClips();
}

function editClip(id) {
  const clip = clips.find(c => c.id === id);
  if (!clip) return;

  const title = prompt("Clip name:", clip.title);
  if (title === null) return;

  const content = prompt("Clip content:", clip.content);
  if (content === null) return;

  clip.title = title;
  clip.content = content;
  saveData();
  renderClips();
}

function showAll() {
  folderMode = false;
  document.getElementById("search").value = "";
  document.getElementById("filterCategory").value = "All";
  renderClips();
}

function showFolders() {
  folderMode = true;
  renderClips();
}

function renderClips() {
  const list = document.getElementById("clipList");
  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("filterCategory").value;

  document.getElementById("listTitle").textContent =
    folderMode ? "📁 My Folders" : "📚 My Library";

  document.getElementById("statistics").textContent =
    clips.length + " saved clips • " +
    new Set(clips.map(c => c.folder)).size + " folders";

  if (folderMode) {
    const folders = [...new Set(clips.map(c => c.folder))];
    list.innerHTML = "";

    if (!folders.length) {
      list.innerHTML = '<div id="empty">No folders yet. Save your first clip!</div>';
      return;
    }

    folders.forEach(folder => {
      const count = clips.filter(c => c.folder === folder).length;
      const button = document.createElement("button");
      button.className = "secondary";
      button.textContent = "📁 " + folder + " (" + count + ")";
      button.onclick = () => {
        folderMode = false;
        document.getElementById("search").value = folder;
        renderClips();
      };
      list.appendChild(button);
    });
    return;
  }

  const filtered = clips.filter(c => {
    const matchesSearch =
      (c.title + " " + c.content + " " + c.folder).toLowerCase().includes(search);
    const matchesCategory =
      category === "All" || c.category === category;
    return matchesSearch && matchesCategory;
  });

  list.innerHTML = "";

  if (!filtered.length) {
    list.innerHTML = '<div id="empty">No clips found. Your saved clips will appear here.</div>';
    return;
  }

  filtered.forEach(c => {
    const card = document.createElement("div");
    card.className = "clip";

    const heading = document.createElement("h3");
    heading.textContent = c.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = c.category + " • 📁 " + c.folder +
      " • " + new Date(c.date).toLocaleDateString();

    const content = document.createElement("p");
    content.textContent = c.content;

    const actions = document.createElement("div");
    actions.className = "actions";

    function makeButton(label, action, style) {
      const b = document.createElement("button");
      b.className = "small " + (style || "");
      b.textContent = label;
      b.onclick = action;
      actions.appendChild(b);
    }

    makeButton("📋 Copy", () => copyClip(c.id));
    makeButton("✏️ Edit", () => editClip(c.id), "secondary");
    makeButton("🗑 Delete", () => deleteClip(c.id), "delete");

    card.append(heading, meta, content, actions);
    list.appendChild(card);
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify(clips, null, 2)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "clipnest-backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported) ||
          !imported.every(c => c && typeof c.id === "string" &&
            typeof c.content === "string" && typeof c.title === "string")) {
        throw new Error("Invalid backup");
      }
      if (!confirm("Replace your current library with this backup?")) return;
      clips = imported;
      saveData();
      renderClips();
      alert("Backup restored!");
    } catch (error) {
      alert("That backup file could not be read.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

renderClips();
</script>

</body>
</html>
